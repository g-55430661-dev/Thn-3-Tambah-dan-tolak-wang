<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kuiz Interaktif: Tambah & Tolak Wang (Tahun 3)</title>
    <style>
        :root { --primary: #4A90E2; --secondary: #FF6B6B; --bg: #F0F4F8; --text: #333; --success: #2ECC71; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: var(--bg); color: var(--text); margin: 0; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .container { background: white; padding: 30px; border-radius: 15px; box-shadow: 0 10px 20px rgba(0,0,0,0.1); max-width: 600px; width: 100%; }
        h1, h2 { text-align: center; color: var(--primary); }
        .hidden { display: none !important; }
        .btn { display: block; width: 100%; padding: 15px; margin: 10px 0; background-color: var(--primary); color: white; border: none; border-radius: 8px; font-size: 16px; cursor: pointer; transition: 0.3s; }
        .btn:hover { background-color: #357ABD; }
        .btn-secondary { background-color: var(--secondary); }
        .btn-secondary:hover { background-color: #E05252; }
        input, select { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ccc; border-radius: 8px; box-sizing: border-box; font-size: 16px; }
        
        /* Quiz Elements */
        .progress-bar { width: 100%; background: #e0e0e0; border-radius: 10px; height: 10px; margin-bottom: 20px; }
        .progress-fill { height: 10px; background: var(--success); border-radius: 10px; width: 0%; transition: 0.3s; }
        .question-img { max-width: 100%; border-radius: 10px; margin-bottom: 15px; display: none; }
        .options-grid { display: grid; gap: 10px; }
        .option-btn { padding: 15px; border: 2px solid var(--primary); background: white; color: var(--text); border-radius: 8px; cursor: pointer; font-size: 16px; transition: 0.2s; }
        .option-btn:hover { background: #e6f0fa; }
        .feedback { margin-top: 15px; padding: 15px; border-radius: 8px; display: none; }
        .feedback.correct { background-color: #d4edda; border: 1px solid #c3e6cb; color: #155724; }
        .feedback.incorrect { background-color: #f8d7da; border: 1px solid #f5c6cb; color: #721c24; }
        
        /* Table Guru */
        table { width: 100%; border-collapse: collapse; margin-top: 20px; font-size: 14px; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        th { background-color: var(--primary); color: white; }
    </style>
</head>
<body>

<div class="container" id="app">
    <!-- Main Menu -->
    <div id="view-menu">
        <h1>Matematik Tahun 3</h1>
        <h2>Tambah & Tolak Wang</h2>
        <button class="btn" onclick="showView('view-murid')">Mod Murid</button>
        <button class="btn btn-secondary" onclick="showView('view-guru')">Mod Guru</button>
    </div>

    <!-- Mod Murid Login -->
    <div id="view-murid" class="hidden">
        <h2>Daftar Masuk Murid</h2>
        <label>Nama Murid:</label>
        <input type="text" id="studentName" placeholder="Masukkan nama anda" required>
        <label>Kelas:</label>
        <select id="studentClass">
            <option value="3 DEDIKASI">3 DEDIKASI</option>
            <option value="3 EFEKTIF">3 EFEKTIF</option>
            <option value="3 INOVATIF">3 INOVATIF</option>
            <option value="3 INTELEK">3 INTELEK</option>
            <option value="3 KREATIF">3 KREATIF</option>
            <option value="3 OPTIMIS">3 OPTIMIS</option>
            <option value="3 POSITIF">3 POSITIF</option>
            <option value="3 PROAKTIF">3 PROAKTIF</option>
            <option value="3 PROGRESIF">3 PROGRESIF</option>
        </select>
        <button class="btn" onclick="startQuiz()">Mula Kuiz</button>
        <button class="btn btn-secondary" onclick="showView('view-menu')">Kembali</button>
    </div>

    <!-- Mod Guru Login -->
    <div id="view-guru" class="hidden">
        <h2>Mod Guru</h2>
        <label>Kata Laluan:</label>
        <input type="password" id="guruPassword" placeholder="Masukkan kata laluan">
        <button class="btn" onclick="loginGuru()">Log Masuk</button>
        <button class="btn btn-secondary" onclick="showView('view-menu')">Kembali</button>
    </div>

    <!-- Quiz Area -->
    <div id="view-quiz" class="hidden">
        <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
        <p>Soalan <span id="qCurrent">1</span> daripada <span id="qTotal">30</span> | Skor: <span id="scoreDisplay">0</span></p>
        <img id="qImage" class="question-img" src="" alt="Soalan Gambar">
        <h3 id="qText">Soalan akan dipaparkan di sini</h3>
        <div id="optionsArea" class="options-grid"></div>
        <div id="feedbackArea" class="feedback"></div>
        <button class="btn" id="nextBtn" class="hidden" style="display:none;" onclick="nextQuestion()">Seterusnya</button>
    </div>

    <!-- Results Area -->
    <div id="view-results" class="hidden">
        <h2>Tahniah, <span id="resName"></span>!</h2>
        <h3>Skor Anda: <span id="resScore"></span> / 30</h3>
        <h3>Peratus: <span id="resPercent"></span>%</h3>
        <div id="resSummary" style="padding: 15px; background: #e6f0fa; border-radius: 8px; margin: 15px 0;"></div>
        <button class="btn" onclick="location.reload()">Selesai (Kembali ke Utama)</button>
    </div>

    <!-- Guru Dashboard -->
    <div id="view-dashboard" class="hidden">
        <h2>Papan Pemuka Guru</h2>
        <button class="btn" onclick="loadDataGoogleSheet()">Muat Semula Data (Dari Google Sheets)</button>
        <div style="overflow-x: auto;">
            <table id="guruTable">
                <thead>
                    <tr><th>Nama</th><th>Kelas</th><th>Skor</th><th>Peratus</th><th>Topik Perlu Disemak</th></tr>
                </thead>
                <tbody id="guruTableBody"></tbody>
            </table>
        </div>
        <button class="btn btn-secondary" style="margin-top:20px" onclick="showView('view-menu')">Log Keluar</button>
    </div>
</div>

<script>
    // URL Web App Google Apps Script anda (Gantikan URL ini)
    const GOOGLE_SHEET_WEBAPP_URL = "MASUKKAN_WEB_APP_URL_ANDA_DI_SINI"; 

    // Bank Soalan (Satu himpunan contoh soalan mengikut keperluan. Sebahagian untuk demo, format menyokong sehingga 30 soalan)
    const questions = [
        { type: "mcq", q: "Berapakah hasil tambah RM 15.50 dan RM 12.00?", options: ["RM 27.50", "RM 25.50", "RM 28.00", "RM 27.00"], answer: "RM 27.50", explanation: "RM 15.50 + RM 12.00 = RM 27.50. Tambahkan sen dahulu, kemudian ringgit.", topic: "Tambah Wang" },
        { type: "tf", q: "Betul atau Salah: RM 50.00 tolak RM 15.50 ialah RM 35.50.", options: ["Betul", "Salah"], answer: "Salah", explanation: "Salah. RM 50.00 - RM 15.50 = RM 34.50. Pastikan anda pinjam dari bahagian ringgit dengan betul.", topic: "Tolak Wang" },
        { type: "scenario", q: "Ali ada RM 100. Dia membeli beg sekolah berharga RM 45.90. Berapakah baki wangnya?", options: ["RM 44.10", "RM 54.10", "RM 55.10", "RM 64.10"], answer: "RM 54.10", explanation: "RM 100.00 - RM 45.90 = RM 54.10. ", topic: "Tolak Wang (Penyelesaian Masalah)" },
        { type: "mcq", q: "Cari beza antara RM 89.20 dan RM 34.80", options: ["RM 54.40", "RM 55.40", "RM 54.60", "RM 124.00"], answer: "RM 54.40", explanation: "Tolak nilai kecil dari nilai besar: RM 89.20 - RM 34.80 = RM 54.40.", topic: "Tolak Wang" },
        { type: "mcq", q: "Tambahkan RM 125.60, RM 40.00 dan RM 15.20", options: ["RM 180.80", "RM 170.80", "RM 180.00", "RM 160.80"], answer: "RM 180.80", explanation: "Susun dalam bentuk lazim dan tambah titik perpuluhan sebaris. Hasilnya RM 180.80.", topic: "Tambah Wang Berturut-turut" }
        // Di dalam versi sebenar, anda boleh menambah senarai array ini sehingga 30 soalan dengan format yang sama.
    ];

    // Auto-generate baki soalan untuk mencukupkan 30 (Hanya untuk demonstrasi kod)
    for(let i=6; i<=30; i++) {
        questions.push({
            type: i%2===0 ? "mcq" : "tf",
            q: `Latihan Soalan ${i}: Tambah dan Tolak wang asas. Selesaikan RM ${i+10}.00 + RM 5.50`,
            options: i%2===0 ? [`RM ${i+15}.50`, `RM ${i+16}.50`, "RM 10.00", "RM 0.00"] : ["Betul", "Salah"],
            answer: i%2===0 ? `RM ${i+15}.50` : "Salah",
            explanation: `Penerangan untuk soalan ${i}. Konsep asas operasi wang.`,
            topic: "Latihan Campuran Wang"
        });
    }

    let currentQIndex = 0;
    let score = 0;
    let studentData = {};
    let mistakes = [];

    function showView(viewId) {
        document.querySelectorAll('.container > div').forEach(div => div.classList.add('hidden'));
        document.getElementById(viewId).classList.remove('hidden');
    }

    function startQuiz() {
        const name = document.getElementById('studentName').value;
        const cls = document.getElementById('studentClass').value;
        if (!name) return alert("Sila masukkan nama anda!");
        
        studentData = { nama: name, kelas: cls, skor: 0, peratus: 0, topik: "" };
        currentQIndex = 0; score = 0; mistakes = [];
        document.getElementById('scoreDisplay').innerText = score;
        document.getElementById('qTotal').innerText = questions.length;
        
        showView('view-quiz');
        renderQuestion();
    }

    function renderQuestion() {
        const q = questions[currentQIndex];
        document.getElementById('qCurrent').innerText = currentQIndex + 1;
        document.getElementById('qText').innerText = q.q;
        
        // Kemaskini Progress Bar
        const progress = ((currentQIndex) / questions.length) * 100;
        document.getElementById('progressFill').style.width = `${progress}%`;

        const optionsArea = document.getElementById('optionsArea');
        optionsArea.innerHTML = '';
        
        q.options.forEach(opt => {
            const btn = document.createElement('button');
            btn.className = 'option-btn';
            btn.innerText = opt;
            btn.onclick = () => checkAnswer(opt, btn);
            optionsArea.appendChild(btn);
        });

        const feedback = document.getElementById('feedbackArea');
        feedback.style.display = 'none';
        document.getElementById('nextBtn').style.display = 'none';
    }

    function checkAnswer(selected, btn) {
        const q = questions[currentQIndex];
        const feedback = document.getElementById('feedbackArea');
        const optionsArea = document.getElementById('optionsArea');
        
        // Disable semua butang selepas pilih
        Array.from(optionsArea.children).forEach(b => b.disabled = true);

        if (selected === q.answer) {
            score++;
            document.getElementById('scoreDisplay').innerText = score;
            btn.style.background = '#d4edda';
            feedback.className = 'feedback correct';
            feedback.innerHTML = `<strong>Tepat!</strong> ${q.explanation}`;
        } else {
            mistakes.push(q.topic);
            btn.style.background = '#f8d7da';
            feedback.className = 'feedback incorrect';
            feedback.innerHTML = `<strong>Kurang Tepat.</strong> Jawapan yang betul ialah ${q.answer}.<br><br><em>Klu: ${q.explanation}</em>`;
        }
        
        feedback.style.display = 'block';
        document.getElementById('nextBtn').style.display = 'block';
    }

    function nextQuestion() {
        currentQIndex++;
        if (currentQIndex < questions.length) {
            renderQuestion();
        } else {
            endQuiz();
        }
    }

    function endQuiz() {
        const percent = Math.round((score / questions.length) * 100);
        studentData.skor = score;
        studentData.peratus = percent;
        
        // Cari topik yang paling banyak salah
        const topMistake = mistakes.length > 0 ? mistakes.sort((a,b) =>
            mistakes.filter(v => v===a).length - mistakes.filter(v => v===b).length
        ).pop() : "Tiada (Sangat Cemerlang)";
        
        studentData.topik = topMistake;

        document.getElementById('resName').innerText = studentData.nama;
        document.getElementById('resScore').innerText = score;
        document.getElementById('resPercent').innerText = percent;
        
        let msg = percent >= 80 ? "Hebat! Teruskan usaha cemerlang anda." :
                  percent >= 50 ? "Tahniah! Anda boleh buat lebih baik dengan sedikit latihan tambahan." :
                  "Jangan putus asa! Mari ulangkaji semula bahagian ini.";
        
        document.getElementById('resSummary').innerHTML = `
            <p>${msg}</p>
            <p><strong>Cadangan Semakan:</strong> Anda dinasihatkan untuk memberi fokus kepada topik: <em>${topMistake}</em>.</p>
        `;

        saveToGoogleSheet(studentData);
        showView('view-results');
    }

    function saveToGoogleSheet(data) {
        // Simpan dalam local storage sebagai backup
        let allData = JSON.parse(localStorage.getItem('kuizData') || '[]');
        allData.push(data);
        localStorage.setItem('kuizData', JSON.stringify(allData));

        // Hantar ke Google Sheets jika URL diletakkan
        if(GOOGLE_SHEET_WEBAPP_URL !== "MASUKKAN_WEB_APP_URL_ANDA_DI_SINI") {
            fetch(GOOGLE_SHEET_WEBAPP_URL, {
                method: 'POST',
                body: JSON.stringify(data),
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' }
            }).catch(e => console.log('Google Sheet save error', e));
        }
    }

    function loginGuru() {
        const pwd = document.getElementById('guruPassword').value;
        if (pwd === '8888') {
            document.getElementById('guruPassword').value = '';
            showView('view-dashboard');
            loadDashboardData();
        } else {
            alert('Kata laluan salah!');
        }
    }

    function loadDashboardData() {
        const tbody = document.getElementById('guruTableBody');
        tbody.innerHTML = '';
        let allData = JSON.parse(localStorage.getItem('kuizData') || '[]');
        
        if (allData.length === 0) {
            tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;">Belum ada data murid direkodkan.</td></tr>';
            return;
        }

        allData.forEach(d => {
            let row = `<tr>
                <td>${d.nama}</td>
                <td>${d.kelas}</td>
                <td>${d.skor}/30</td>
                <td>${d.peratus}%</td>
                <td>${d.topik}</td>
            </tr>`;
            tbody.innerHTML += row;
        });
    }

    function loadDataGoogleSheet() {
        if(GOOGLE_SHEET_WEBAPP_URL === "https://script.google.com/macros/s/AKfycbxVMV0GKmN8uIEZgRs_QJmdJ4Esnh8qZgZC-mro8ZmCn2K6YPfg9nG_lTbxJkbnep2i/exec") {
            alert("Sila masukkan Web App URL Google Apps Script di dalam fail kod HTML anda terlebih dahulu.");
            return;
        }
        
        fetch(GOOGLE_SHEET_WEBAPP_URL)
        .then(res => res.json())
        .then(data => {
            const tbody = document.getElementById('guruTableBody');
            tbody.innerHTML = '';
            // Anggap baris 0 adalah header
            for(let i=1; i<data.length; i++){
                let row = `<tr>
                    <td>${data[i][1]}</td>
                    <td>${data[i][2]}</td>
                    <td>${data[i][3]}</td>
                    <td>${data[i][4]}</td>
                    <td>${data[i][5]}</td>
                </tr>`;
                tbody.innerHTML += row;
            }
        })
        .catch(e => alert('Gagal memuat turun data. Pastikan CORS dan URL Web App betul.'));
    }
</script>
</body>
</html>
